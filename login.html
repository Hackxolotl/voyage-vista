<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - VoyageVista</title>
</head>
<body>

    <h1>Connexion</h1>

    <form id="loginForm">
        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            required
        >

        <br><br>

        <button type="submit">
            Se connecter
        </button>
    </form>

    <p id="message"></p>

    <script src="./login.js"></script>

</body>
</html>
