<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - VoyageVista</title>
</head>
<body>

    <h1>Inscription</h1>

    <form id="registerForm">

        <input
            type="text"
            id="nom"
            placeholder="Nom"
            required
        >

        <br><br>

        <input
            type="text"
            id="prenom"
            placeholder="Prénom"
            required
        >

        <br><br>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            required
        >

        <br><br>

        <label>
            <input
                type="checkbox"
                id="etudiant"
            >
            Je suis étudiant
        </label>

        <br><br>

        <button type="submit">
            Créer mon compte
        </button>

    </form>

    <p id="message"></p>

    <script src="./register.js"></script>

</body>
</html>
